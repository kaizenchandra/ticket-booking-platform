# Kubernetes baseline; managed PostgreSQL and a real OIDC provider are prerequisites.
apiVersion: v1
kind: ConfigMap
metadata: { name: ticketing-config }
data:
  DEMO: "false"
  WAITING_ROOM: "true"
  ADMISSION_PER_SECOND: "20"
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: "https://identity.example.com/realms/ticketing"
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: ticketing }
spec:
  replicas: 2
  selector: { matchLabels: { app: ticketing } }
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  template:
    metadata: { labels: { app: ticketing } }
    spec:
      terminationGracePeriodSeconds: 35
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: ticketing } }
      containers:
        - name: app
          image: ticket-booking-platform:1.0.0
          ports: [ { containerPort: 8080 } ]
          envFrom: [ { configMapRef: { name: ticketing-config } }, { secretRef: { name: ticketing-secrets } } ]
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: "2", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ ALL ] }
          volumeMounts: [ { name: temp, mountPath: /tmp } ]
          startupProbe: { httpGet: { path: /actuator/health/liveness, port: 8080 }, failureThreshold: 30, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: 8080 }, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8080 }, periodSeconds: 5 }
      volumes: [ { name: temp, emptyDir: { sizeLimit: 64Mi } } ]
---
apiVersion: v1
kind: Service
metadata: { name: ticketing }
spec:
  selector: { app: ticketing }
  ports: [ { port: 80, targetPort: 8080 } ]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: ticketing }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: ticketing }
  minReplicas: 2
  maxReplicas: 6
  metrics: [ { type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } } } ]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: ticketing }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: ticketing } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: ticketing }
spec:
  tls: [ { hosts: [ tickets.example.com ], secretName: ticketing-tls } ]
  rules:
    - host: tickets.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: ticketing, port: { number: 80 } } }
