groups:
  - name: ticketing
    rules:
      - alert: ExpiryWorkerBehind
        expr: ticketing_expiry_lag_seconds > 30
        for: 2m
        labels: { severity: warning }
        annotations: { summary: "Hold cleanup delayed; inspect DB locks and worker logs" }
      - alert: OutboxBacklog
        expr: ticketing_outbox_backlog > 1000
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Ticket issuance or notifications delayed" }
      - alert: CheckoutErrors
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count[5m])),1) > 0.01
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "API error ratio exceeds one percent" }
